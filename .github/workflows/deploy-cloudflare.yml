name: Deploy 4L Fashion to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_STORE_HOST: ${{ vars.CLOUDFLARE_STORE_HOST || '4lfashion.com.qa' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under repository Settings > Secrets and variables > Actions, then rerun this workflow.'
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Resolve Worker serving the live domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/resolve-cloudflare-target.mjs

      - name: Enable the pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Test commerce, offline operations and Google login
        run: pnpm test

      - name: Build Worker and PWA assets
        run: pnpm build

      - name: Create missing commerce and login tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 execute DB --remote --config dist/server/wrangler.json --file scripts/cloudflare-bootstrap.sql

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json

      - name: Verify release on the live domain
        run: node scripts/verify-cloudflare-release.mjs

      - name: Deployment summary
        run: |
          echo '## 4L Fashion deployed' >> "$GITHUB_STEP_SUMMARY"
          echo 'TypeScript, tests, PWA build, D1 setup, Worker deployment and public-domain release verification completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Google login still requires the Google credentials, APP_URL and OWNER_EMAIL in the Cloudflare Worker runtime settings.' >> "$GITHUB_STEP_SUMMARY"
